
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tạo thiệp mời | Khánh Ly & Tiến Dũng</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f1e9;
      font-family: Arial, sans-serif;
      color: #60423d;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px 22px;
      background: #fffdfb;
      border: 1px solid #e7d5c4;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(90, 40, 30, 0.08);
    }

    .heading {
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 3px;
      color: #b08a56;
      font-weight: 600;
    }

    .heart {
      margin-top: 14px;
      font-size: 22px;
      color: #92263c;
    }

    h1 {
      margin: 8px 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: normal;
      color: #92263c;
    }

    .couple {
      margin: 0 0 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-style: italic;
      line-height: 1.6;
      color: #7f3440;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #e3d2c5;
      border-radius: 10px;
      background: #fff;
      color: #60423d;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #92263c;
    }

    button, .preview {
      width: 100%;
      display: block;
      margin-top: 12px;
      padding: 14px 12px;
      border: none;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .primary {
      background: #92263c;
      color: #fff;
    }

    .secondary {
      background: #f3e8df;
      color: #92263c;
    }

    .create {
      margin-top: 24px;
    }

    .result {
      display: none;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid #eaded3;
    }

    .result-title {
      font-size: 14px;
      text-align: center;
      font-weight: 600;
    }

    .link-box {
      margin: 12px 0 16px;
      padding: 12px;
      background: #faf6f1;
      border: 1px solid #eaded3;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      user-select: all;
    }

    .message {
      min-height: 20px;
      margin: 14px 0 0;
      font-size: 13px;
      color: #92263c;
      text-align: center;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #aa9185;
    }

    @media (max-width: 390px) {
      .card {
        padding: 26px 18px;
      }

      h1 {
        font-size: 25px;
      }

      .couple {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="heading">
      <div class="eyebrow">WEDDING INVITATION</div>

      <div class="heart">♡</div>

      <h1>Tạo thiệp mời</h1>

      <p class="couple">
        Khánh Ly &amp; Tiến Dũng
      </p>
    </div>

    <label for="guest">
      Tên khách mời
    </label>

    <input
      type="text"
      id="guest"
      placeholder="Ví dụ: Chú Doanh và gia đình"
      maxlength="120"
      autocomplete="off"
    >

    <label for="side">
      Khách mời thuộc bên nào?
    </label>

    <select id="side">
      <option value="bride">Nhà gái</option>
      <option value="groom">Nhà trai</option>
      <option value="both">Cả hai bên</option>
    </select>

    <button class="primary create" id="create">
      TẠO LINK THIỆP MỜI
    </button>

    <section class="result" id="result">

      <div class="result-title">
        ♡ Link thiệp mời của khách ♡
      </div>

      <div class="link-box" id="link"></div>

      <button class="primary" id="copy">
        SAO CHÉP LINK
      </button>

      <button class="secondary" id="share">
        CHIA SẺ THIỆP MỜI
      </button>

      <a
        class="preview secondary"
        id="preview"
        target="_blank"
        rel="noopener noreferrer"
      >
        XEM TRƯỚC THIỆP
      </a>

    </section>

    <p class="message" id="message" role="status"></p>

    <div class="footer">
      Khánh Ly ♡ Tiến Dũng · 25.10.2026
    </div>

  </main>

  <script>
    const SITE_URL =
      "https://nguyenvuong27122005.github.io/Thiepcuoi/";

    const guestInput = document.getElementById("guest");
    const sideInput = document.getElementById("side");
    const result = document.getElementById("result");
    const linkBox = document.getElementById("link");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");

    let currentLink = "";

    function resetResult() {
      currentLink = "";
      result.style.display = "none";
      message.textContent = "";
    }

    guestInput.addEventListener("input", resetResult);
    sideInput.addEventListener("change", resetResult);

    document.getElementById("create").addEventListener(
      "click",
      function () {
        const guest = guestInput.value.trim();
        const side = sideInput.value;

        if (!guest) {
          message.textContent = "Vui lòng nhập tên khách mời.";
          guestInput.focus();
          return;
        }

        const url = new URL(SITE_URL);

        url.searchParams.set("guest", guest);
        url.searchParams.set("side", side);

        currentLink = url.toString();

        linkBox.textContent = currentLink;
        preview.href = currentLink;

        result.style.display = "block";

        message.textContent = "Đã tạo link thiệp mời thành công!";
      }
    );

    document.getElementById("copy").addEventListener(
      "click",
      async function () {
        if (!currentLink) return;

        try {
          await navigator.clipboard.writeText(currentLink);
          message.textContent =
            "Đã sao chép link! Bạn có thể gửi qua Zalo.";
        } catch (error) {
          message.textContent =
            "Không thể tự sao chép. Hãy chọn link phía trên và sao chép thủ công.";
        }
      }
    );

    document.getElementById("share").addEventListener(
      "click",
      async function () {
        if (!currentLink) return;

        if (navigator.share) {
          try {
            await navigator.share({
              title: "Thiệp cưới Khánh Ly & Tiến Dũng",
              url: currentLink
            });
          } catch (error) {
            if (error.name !== "AbortError") {
              message.textContent =
                "Không thể chia sẻ. Hãy dùng nút Sao chép link.";
            }
          }
        } else {
          message.textContent =
            "Hãy sao chép link rồi gửi qua Zalo.";
        }
      }
    );
  </script>

</body>
</html>
